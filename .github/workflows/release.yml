# Publishes a GitHub release with the matching section of CHANGELOG.md as its notes.
#
# To release: add the version's section to CHANGELOG.md and bump the version on
# main, then either
#   - Actions → Release → Run workflow, with the tag (v1.2.0): the tag is created
#     on the latest commit of main; or
#   - push a tag yourself: git tag v1.2.0 && git push origin v1.2.0
# Running it again for an existing release updates its notes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, e.g. v1.2.0 (created on this branch's latest commit if it does not exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.0, not $TAG"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json says $version, the tag is $TAG"
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          # The lines under "## <version> …", up to the next "## " heading.
          awk -v v="$version" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Ditto $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "Ditto $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
